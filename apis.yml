aid: aero
name: Aero
description: 'Aero Technologies, Inc. is a Van Nuys, California semi-private airline
  founded in 2019 by Uber co-founder Garrett Camp, selling individual seats on scheduled
  flights and on-demand charters operated exclusively from private terminals. Its fleet
  comprises Embraer ERJ135 and Legacy 600 jets plus Gulfstream IV-SP aircraft, flying
  Los Angeles to New York City, Aspen, Sun Valley, Napa Valley, Los Cabos, Las Vegas,
  Maui, Miami, Heber and Greater Palm Springs. Aero distributes through aero.com, its
  mobile app, a travel-advisor channel, and Sabre GDS under airline designator 5E with
  plating carrier 307. It is a consumer travel brand: no public developer API, developer
  portal, SDK, webhook surface or machine-readable specification is published.'
